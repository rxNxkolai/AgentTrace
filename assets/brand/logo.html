<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1320px; height: 380px; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #07080a;
    font-family: "Pixelify Sans", monospace;
  }
  .panel {
    position: relative;
    width: 1240px; height: 300px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 18px;
    background: radial-gradient(120% 150% at 50% 28%, #181c1f 0%, #0d0f11 55%, #090a0b 100%);
    box-shadow: inset 0 0 0 1px #21382a, inset 0 0 70px rgba(0,0,0,.72);
    overflow: hidden;
  }
  .panel::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px);
    mix-blend-mode: overlay;
  }
  .panel::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(125% 125% at 50% 50%, transparent 50%, rgba(0,0,0,.5) 100%);
  }
  .word {
    position: relative;
    font-weight: 700;
    font-size: 146px;
    line-height: 1;
    letter-spacing: 1px;
    white-space: nowrap;
    background:
      repeating-linear-gradient(0deg, rgba(4,32,14,0) 0 7px, rgba(4,28,12,.22) 7px 9px),
      linear-gradient(180deg, #ffffff 0%, #d6ffe2 12%, #8dffac 34%, #5cf791 54%, #36e974 74%, #21d061 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow:
      0 3px 0 #109a45,
      0 6px 0 #0b7c37,
      0 9px 0 #086029,
      0 12px 0 #06481f,
      0 15px 0 #043315,
      0 18px 24px rgba(0,0,0,.5),
      0 0 40px rgba(74,255,150,.36);
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="word">AGENTTRACE</div>
  </div>
</body>
</html>
